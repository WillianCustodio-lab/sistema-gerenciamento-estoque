<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Modelo de domínio do incremento da Sprint 3</title>
  <desc id="desc">Diagrama com as entidades Produto e Movimentação.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2457d6"/>
    </marker>
    <style>
      .classBox{fill:#fff;stroke:#2457d6;stroke-width:2}.header{fill:#2457d6}.divider{stroke:#dfe5ee;stroke-width:1.5}.relation{stroke:#2457d6;stroke-width:2;fill:none;marker-end:url(#arrow)}.title{font:700 28px Arial,sans-serif;fill:#172033;text-anchor:middle}.className{font:700 21px Arial,sans-serif;fill:#fff;text-anchor:middle}.attribute{font:17px Consolas,monospace;fill:#172033}.relationLabel{font:600 16px Arial,sans-serif;fill:#667085;text-anchor:middle}.cardinality{font:700 17px Arial,sans-serif;fill:#172033}
    </style>
  </defs>
  <rect width="1100" height="620" fill="#f4f7fb"/>
  <text x="550" y="48" class="title">Modelo de domínio - Produto e Movimentação</text>

  <rect x="90" y="100" width="380" height="400" rx="12" class="classBox"/>
  <path d="M102 100 H458 Q470 100 470 112 V164 H90 V112 Q90 100 102 100" class="header"/>
  <text x="280" y="140" class="className">Produto</text>
  <line x1="90" y1="164" x2="470" y2="164" class="divider"/>
  <text x="120" y="205" class="attribute">+ codigo: String</text>
  <text x="120" y="245" class="attribute">+ nome: String</text>
  <text x="120" y="285" class="attribute">+ categoria: String</text>
  <text x="120" y="325" class="attribute">+ quantidade: Number</text>
  <line x1="90" y1="355" x2="470" y2="355" class="divider"/>
  <text x="120" y="400" class="attribute">+ registrarEntrada(quantidade)</text>

  <rect x="630" y="100" width="380" height="400" rx="12" class="classBox"/>
  <path d="M642 100 H998 Q1010 100 1010 112 V164 H630 V112 Q630 100 642 100" class="header"/>
  <text x="820" y="140" class="className">Movimentação</text>
  <line x1="630" y1="164" x2="1010" y2="164" class="divider"/>
  <text x="660" y="205" class="attribute">+ id: String</text>
  <text x="660" y="245" class="attribute">+ codigoProduto: String</text>
  <text x="660" y="285" class="attribute">+ nomeProduto: String</text>
  <text x="660" y="325" class="attribute">+ tipo: String</text>
  <text x="660" y="365" class="attribute">+ quantidade: Number</text>
  <text x="660" y="405" class="attribute">+ dataHora: Date</text>

  <path d="M470 300 H630" class="relation"/>
  <text x="550" y="282" class="relationLabel">possui</text>
  <text x="485" y="326" class="cardinality">1</text>
  <text x="580" y="326" class="cardinality">0..*</text>

  <text x="550" y="560" class="relationLabel">Um produto pode possuir nenhuma ou várias movimentações.</text>
</svg>
